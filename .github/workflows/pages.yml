name: Deploy public demo

on:
  push:
    branches: [main]
    paths:
      - "public/demo.html"
      - "public/demo.js"
      - "public/styles.css"
      - "public/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build static demo
        run: |
          mkdir -p _site
          cp -R public/assets _site/assets
          cp public/demo.js _site/demo.js
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("public/demo.html").read_text(encoding="utf-8")
          html = re.sub(
              r'(?<=[="\s,])/(assets/|styles\.css|demo\.js)',
              r'./\1',
              html,
          )
          html = html.replace(
              'data-static-demo="false" data-demo-exit-url=""',
              'data-static-demo="true" data-demo-exit-url="https://github.com/HanminYIN/taketime"',
          )
          html = html.replace('content="noindex, nofollow"', 'content="index, follow"')
          html = html.replace(
              '<title>互动演示 · 药时</title>',
              '<title>TakeTime 动态用药排程演示</title>\n'
              '    <link rel="canonical" href="https://hanminyin.github.io/taketime/" />',
          )
          Path("_site/index.html").write_text(html, encoding="utf-8")

          css = Path("public/styles.css").read_text(encoding="utf-8")
          css = css.replace('url("/assets/', 'url("./assets/')
          Path("_site/styles.css").write_text(css, encoding="utf-8")
          Path("_site/.nojekyll").touch()
          PY

      - name: Verify static demo
        run: |
          grep -q 'data-static-demo="true"' _site/index.html
          grep -q 'src="./demo.js"' _site/index.html
          grep -q 'href="./styles.css"' _site/index.html
          if grep -R -n -E '(src|href)="/' _site/index.html; then
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
